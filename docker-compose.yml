services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arrmate
      POSTGRES_USER: arrmate
      POSTGRES_PASSWORD: arrmate_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arrmate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrmate -d arrmate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  arrmate-postgres:
