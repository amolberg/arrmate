<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" role="img" aria-labelledby="title desc">
  <title id="title">The Arrmate media orbit</title>
  <desc id="desc">Abstract movie, series, subtitle, and download cards orbiting a connected Arrmate hub</desc>
  <defs>
    <radialGradient id="bg" cx="52%" cy="47%" r="70%">
      <stop offset="0" stop-color="#23362E"/>
      <stop offset=".52" stop-color="#16211D"/>
      <stop offset="1" stop-color="#0F1513"/>
    </radialGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B8684D"/>
      <stop offset="1" stop-color="#49352D"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#477B6C"/>
      <stop offset="1" stop-color="#1D302A"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#655A85"/>
      <stop offset="1" stop-color="#292637"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#47758A"/>
      <stop offset="1" stop-color="#1D2C33"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence baseFrequency=".8" numOctaves="3" seed="17" type="fractalNoise" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="960" height="900" rx="44" fill="url(#bg)"/>
  <circle cx="480" cy="450" r="316" fill="none" stroke="#B8C8BE" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="480" cy="450" r="234" fill="none" stroke="#B8C8BE" stroke-opacity=".12" stroke-width="2" stroke-dasharray="7 13"/>
  <ellipse cx="480" cy="450" rx="390" ry="195" fill="none" stroke="#F4A181" stroke-opacity=".15" stroke-width="2" transform="rotate(-18 480 450)"/>
  <path d="M277 270 414 391M667 261 547 389M682 628 550 512M274 641 411 516" stroke="#ADC6B8" stroke-opacity=".16" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#shadow)" transform="translate(379 349)">
    <circle cx="101" cy="101" r="101" fill="#E87951" fill-opacity=".12"/>
    <circle cx="101" cy="101" r="75" fill="#F07D57"/>
    <rect x="69" y="103" width="13" height="31" rx="6.5" fill="#20130F"/>
    <rect x="95" y="84" width="13" height="50" rx="6.5" fill="#20130F"/>
    <rect x="121" y="64" width="13" height="70" rx="6.5" fill="#20130F"/>
    <circle cx="70" cy="81" r="7" fill="#FFF7F2"/>
  </g>

  <g filter="url(#shadow)" transform="rotate(-8 229 228)">
    <rect x="111" y="116" width="236" height="224" rx="30" fill="url(#coral)" stroke="#EAB6A2" stroke-opacity=".24"/>
    <rect x="139" y="147" width="180" height="118" rx="18" fill="#1B201D" fill-opacity=".55"/>
    <path d="M177 178h104M177 205h73M177 232h91" stroke="#F3D5C8" stroke-opacity=".55" stroke-width="11" stroke-linecap="round"/>
    <g fill="#F4A181" opacity=".76"><rect x="145" y="286" width="24" height="20" rx="5"/><rect x="179" y="286" width="24" height="20" rx="5"/><rect x="213" y="286" width="24" height="20" rx="5"/><rect x="247" y="286" width="24" height="20" rx="5"/><rect x="281" y="286" width="24" height="20" rx="5"/></g>
  </g>

  <g filter="url(#shadow)" transform="rotate(7 731 214)">
    <rect x="623" y="104" width="216" height="220" rx="30" fill="url(#violet)" stroke="#C0B7E6" stroke-opacity=".24"/>
    <rect x="656" y="138" width="150" height="105" rx="18" fill="#17171E" fill-opacity=".57"/>
    <path d="m716 175 38 22-38 22Z" fill="#D5CFF0" fill-opacity=".72"/>
    <rect x="658" y="270" width="99" height="11" rx="5.5" fill="#D5CFF0" fill-opacity=".48"/>
    <circle cx="783" cy="275" r="11" fill="#A99BE6"/>
  </g>

  <g filter="url(#shadow)" transform="rotate(-5 213 669)">
    <rect x="103" y="563" width="235" height="215" rx="30" fill="url(#blue)" stroke="#B3D8E8" stroke-opacity=".22"/>
    <path d="M153 613h136a18 18 0 0 1 18 18v67a18 18 0 0 1-18 18h-61l-31 28 6-28h-50a18 18 0 0 1-18-18v-67a18 18 0 0 1 18-18Z" fill="#122027" fill-opacity=".6"/>
    <path d="M166 649h111M166 678h78" stroke="#B8D8E5" stroke-opacity=".68" stroke-width="11" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)" transform="rotate(8 731 668)">
    <rect x="619" y="556" width="228" height="222" rx="30" fill="url(#teal)" stroke="#B9DED1" stroke-opacity=".22"/>
    <path d="M683 614v67M712 635v46M741 598v83M770 649v32" stroke="#C3E3D7" stroke-opacity=".7" stroke-width="14" stroke-linecap="round"/>
    <rect x="666" y="714" width="134" height="11" rx="5.5" fill="#14241F" fill-opacity=".75"/>
    <rect x="666" y="714" width="91" height="11" rx="5.5" fill="#78D49F"/>
  </g>

  <g fill="#F4A181"><circle cx="379" cy="357" r="7"/><circle cx="584" cy="355" r="7"/><circle cx="587" cy="551" r="7"/><circle cx="376" cy="548" r="7"/></g>
  <g fill="#E8F0EA" fill-opacity=".62"><circle cx="172" cy="449" r="6"/><circle cx="789" cy="428" r="6"/><circle cx="480" cy="138" r="6"/><circle cx="480" cy="766" r="6"/></g>
  <rect width="960" height="900" rx="44" filter="url(#grain)" opacity=".8"/>
</svg>
